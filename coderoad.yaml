id: 'tovuse/database-lab:v1.0.0'
version: '1.0.0'

config:
  testRunner:
    # 直接调二进制，保证 --grep 能传进去（用 npm run 会被 npm 吞掉）
    command: ./node_modules/.bin/mocha
    args:
      filter: --grep
      tap: --reporter=mocha-tap-reporter
    directory: coderoad
  repo:
    # 本课程不用 git 提交链判题（判题靠重放学生自己的 .sql），
    # branch 指向 main 只是为了让扩展能连上仓库通过校验
    uri: https://github.com/tovuse/database-lab
    branch: main
  setup:
    commands:
      - cd coderoad && npm install
  continue:
    commands:
      - cd coderoad && npm install
  reset:
    commands:
      - cd coderoad && npm install
  dependencies:
    - name: node
      version: '>=18'
  appVersions:
    vscode: '>=0.7.0'

levels:
  - id: '1'
    steps:
      - id: '1.1'
        setup:
          files:
            - sql/1.1_环境自检.sql
          filter: '^1\.1 '
      - id: '1.2'
        setup:
          files:
            - sql/1.2_建用户.sql
          filter: '^1\.2 '
      - id: '1.3'
        setup:
          files:
            - sql/1.3_图书分类.sql
          filter: '^1\.3 '
      - id: '1.4'
        setup:
          files:
            - sql/1.4_图书分类主键.sql
          filter: '^1\.4 '
      - id: '1.5'
        setup:
          files:
            - sql/1.5_罚款分类.sql
          filter: '^1\.5 '
      - id: '1.6'
        setup:
          files:
            - sql/1.6_书目表.sql
          filter: '^1\.6 '
      - id: '1.7'
        setup:
          files:
            - sql/1.7_图书表.sql
          filter: '^1\.7 '
      - id: '1.8'
        setup:
          files:
            - sql/1.8_读者表.sql
          filter: '^1\.8 '
      - id: '1.9'
        setup:
          files:
            - sql/1.9_借阅表.sql
          filter: '^1\.9 '
      - id: '1.10'
        setup:
          files:
            - sql/1.10_预约表.sql
          filter: '^1\.10 '
      - id: '1.11'
        setup:
          files:
            - sql/1.11_插入数据.sql
          filter: '^1\.11 '
      - id: '1.12'
        setup:
          files:
            - sql/1.12_增删改.sql
          filter: '^1\.12 '
      - id: '1.13'
        setup:
          files:
            - sql/1.13_完整性扩展.sql
          filter: '^1\.13 '
  - id: '2'
    # Level 2 的查询题要用全部 7 张表 + 原始数据。
    # 学生 Level 1 只建了一张表，所以进入本关时自动装载基线。
    # loadBaseline.sh 是幂等的：重复执行会先清空再重建，不会报"表已存在"。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
    steps:
      - id: '2.1'
        setup:
          files:
            - sql/2.1_可借红楼梦.sql
          filter: '^2\.1 '
      - id: '2.2'
        setup:
          files:
            - sql/2.2_出版社书目.sql
          filter: '^2\.2 '
      - id: '2.3'
        setup:
          files:
            - sql/2.3_出版社价格.sql
          filter: '^2\.3 '
      - id: '2.4'
        setup:
          files:
            - sql/2.4_从未借书.sql
          filter: '^2\.4 '
      - id: '2.5'
        setup:
          files:
            - sql/2.5_未还图书.sql
          filter: '^2\.5 '
      - id: '2.6'
        setup:
          files:
            - sql/2.6_红楼梦藏书量.sql
          filter: '^2\.6 '
      - id: '2.7'
        setup:
          files:
            - sql/2.7_指定读者未还.sql
          filter: '^2\.7 '
      - id: '2.8'
        setup:
          files:
            - sql/2.8_借阅两本以上.sql
          filter: '^2\.8 '
      - id: '2.9'
        setup:
          files:
            - sql/2.9_王菲借阅.sql
          filter: '^2\.9 '
      - id: '2.10'
        setup:
          files:
            - sql/2.10_每类册数均价.sql
          filter: '^2\.10 '
      - id: '2.11'
        setup:
          files:
            - sql/2.11_参与借书人数.sql
          filter: '^2\.11 '
      - id: '2.12'
        setup:
          files:
            - sql/2.12_Internet开头.sql
          filter: '^2\.12 '
      - id: '2.13'
        setup:
          files:
            - sql/2.13_各图书罚款.sql
          filter: '^2\.13 '
      - id: '2.14'
        setup:
          files:
            - sql/2.14_罚款左外连接.sql
          filter: '^2\.14 '
      - id: '2.15'
        setup:
          files:
            - sql/2.15_借阅全部文学类.sql
          filter: '^2\.15 '
  - id: '3'
    # Level 3 用 PL/SQL 写存储过程和触发器，判题会重放基线 + 建过程 + 调用 + 断言数据变化。
    # 部分关卡依赖前面关卡建好的对象（如 3.6 依赖 3.5 的序列），测试里用 answers/ 下的标准答案补齐。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
    steps:
      - id: '3.1'
        setup:
          files:
            - sql/3.1_借书过程.sql
          filter: '^3\.1 '
      - id: '3.2'
        setup:
          files:
            - sql/3.2_调用借书.sql
          filter: '^3\.2 '
      - id: '3.3'
        setup:
          files:
            - sql/3.3_预约过程.sql
          filter: '^3\.3 '
      - id: '3.4'
        setup:
          files:
            - sql/3.4_还书过程.sql
          filter: '^3\.4 '
      - id: '3.5'
        setup:
          files:
            - sql/3.5_序列.sql
          filter: '^3\.5 '
      - id: '3.6'
        setup:
          files:
            - sql/3.6_简化借书过程.sql
          filter: '^3\.6 '
      - id: '3.7'
        setup:
          files:
            - sql/3.7_借阅触发器.sql
          filter: '^3\.7 '
      - id: '3.8'
        setup:
          files:
            - sql/3.8_丢失过程.sql
          filter: '^3\.8 '
  - id: '4'
    # Level 4 = 实验四 数据库恢复与安全性。
    # 4.1-4.3 是 Data Pump 命令（expdp/impdp），判题器解析 .sh 里的参数后自己执行；
    # 4.4 起回到 SQL，直接在 COURSE schema 里操作。
    # level setup 重建基线，保证每关起点一致。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
    steps:
      - id: '4.1'
        setup:
          files:
            - sql/4.1_导出预约表.sh
          filter: '^4\.1 '
      - id: '4.2'
        setup:
          files:
            - sql/4.2_导入预约表.sh
          filter: '^4\.2 '
      - id: '4.3'
        setup:
          files:
            - sql/4.3_全库导出.sh
          filter: '^4\.3 '
      - id: '4.4'
        setup:
          files:
            - sql/4.4_开启行移动.sql
          filter: '^4\.4 '
      - id: '4.5'
        setup:
          files:
            - sql/4.5_闪回预约表.sql
          filter: '^4\.5 '
      - id: '4.6'
        setup:
          files:
            - sql/4.6_建用户并授权.sql
          filter: '^4\.6 '
      - id: '4.7'
        setup:
          files:
            - sql/4.7_查看权限.sql
          filter: '^4\.7 '
      - id: '4.8'
        setup:
          files:
            - sql/4.8_建角色.sql
          filter: '^4\.8 '
      - id: '4.9'
        setup:
          files:
            - sql/4.9_用户oper借书.sql
          filter: '^4\.9 '
      - id: '4.10'
        setup:
          files:
            - sql/4.10_建视图.sql
          filter: '^4\.10 '
      - id: '4.11'
        setup:
          files:
            - sql/4.11_授视图查询.sql
          filter: '^4\.11 '
      - id: '4.12'
        setup:
          files:
            - sql/4.12_建PROFILE.sql
          filter: '^4\.12 '
      - id: '4.13'
        setup:
          files:
            - sql/4.13_手工解锁.sql
          filter: '^4\.13 '
      - id: '4.14'
        setup:
          files:
            - sql/4.14_撤销并删除用户.sql
          filter: '^4\.14 '
