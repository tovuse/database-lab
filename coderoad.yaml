  - id: '4'
    # Level 4 = 实验四 数据库恢复与安全性。
    # 4.1-4.8 是 Data Pump 命令（expdp/impdp），判题器解析 .sh 里的参数后自己执行；
    # 骨架关只做参数校验（命令本来就不完整），最后一步才真的跑。
    # 4.9 起回到 SQL，直接在 COURSE schema 里操作。
    # level setup 重建基线，保证每关起点一致。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
