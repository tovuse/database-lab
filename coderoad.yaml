id: 'yourorg/database-lab:v1.0.0'
version: '1.0.0'

config:
  testRunner:
    # 直接调二进制，保证 --grep 能传进去（用 npm run 会被 npm 吞掉）
    command: ./node_modules/.bin/mocha
    args:
      filter: --grep
      tap: --reporter=mocha-tap-reporter
    directory: coderoad
  repo:
    uri: https://github.com/yourorg/database-lab
    branch: v1.0.0
  setup:
    commands:
      - cd coderoad && npm install
  continue:
    commands:
      - cd coderoad && npm install
  reset:
    commands:
      - cd coderoad && npm install
  dependencies:
    - name: node
      version: '>=18'
  appVersions:
    vscode: '>=0.7.0'

levels:
  - id: '1'
    steps:
      - id: '1.1'
        setup:
          files:
            - sql/1.1_环境自检.sql
          filter: '^1\.1 '
      - id: '1.2'
        setup:
          files:
            - sql/1.2_建用户.sql
          filter: '^1\.2 '
      - id: '1.3'
        setup:
          files:
            - sql/1.3_图书分类.sql
          filter: '^1\.3 '
          subtasks: true
      - id: '1.4'
        setup:
          files:
            - sql/1.4_图书分类主键.sql
          filter: '^1\.4 '
          subtasks: true
