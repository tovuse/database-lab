    # 一个过程被拆成「骨架 → 补一段 → 再补一段」，每关只加一个动作。
    # 前置对象（如 3.11 依赖 3.10 的序列）由 loadUpTo() 自动按步骤顺序重放答案补齐，
    # 不在这里装载基线——那会清空学生 Level 1/2 做出来的库。
