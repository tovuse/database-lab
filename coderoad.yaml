  - id: '3'
    # Level 3 用 PL/SQL 写存储过程和触发器，判题会重放基线 + 建过程 + 调用 + 断言数据变化。
    # 一个过程被拆成「骨架 → 补一段 → 再补一段」，每关只加一个动作。
    # 依赖前面关卡建好的对象（如 3.11 依赖 3.10 的序列）时，测试里用 answers/ 下的标准答案补齐。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
    steps:
      - id: '3.1'
        setup:
          files:
            - sql/3.1_借书骨架.sql
          filter: '^3\.1 '
      - id: '3.2'
