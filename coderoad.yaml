id: 'yourorg/database-lab:v1.0.0'
version: '1.0.0'

config:
  testRunner:
    # 直接调二进制，保证 --grep 能传进去（用 npm run 会被 npm 吞掉）
    command: ./node_modules/.bin/mocha
    args:
      filter: --grep
      tap: --reporter=mocha-tap-reporter
    directory: coderoad
  repo:
    # 本课程不用 git 提交链判题（判题靠重放学生自己的 .sql），
    # branch 指向 main 只是为了让扩展能连上仓库通过校验
    uri: https://github.com/yourorg/database-lab
    branch: main
  setup:
    commands:
      - cd coderoad && npm install
  continue:
    commands:
      - cd coderoad && npm install
  reset:
    commands:
      - cd coderoad && npm install
  dependencies:
    - name: node
      version: '>=18'
  appVersions:
    vscode: '>=0.7.0'

levels:
  - id: '1'
    steps:
      - id: '1.1'
        setup:
          files:
            - sql/1.1_环境自检.sql
          filter: '^1\.1 '
      - id: '1.2'
        setup:
          files:
            - sql/1.2_建用户.sql
          filter: '^1\.2 '
      - id: '1.3'
        setup:
          files:
            - sql/1.3_图书分类.sql
          filter: '^1\.3 '
          subtasks: true
      - id: '1.4'
        setup:
          files:
            - sql/1.4_图书分类主键.sql
          filter: '^1\.4 '
          subtasks: true
  - id: '2'
    # Level 2 的查询题要用全部 7 张表 + 原始数据。
    # 学生 Level 1 只建了一张表，所以进入本关时自动装载基线。
    # loadBaseline.sh 是幂等的：重复执行会先清空再重建，不会报"表已存在"。
    setup:
      commands:
        - ./scripts/loadBaseline.sh
    steps:
      - id: '2.1'
        setup:
          files:
            - sql/2.1_可借红楼梦.sql
          filter: '^2\.1 '
      - id: '2.2'
        setup:
          files:
            - sql/2.2_出版社书目.sql
          filter: '^2\.2 '
      - id: '2.3'
        setup:
          files:
            - sql/2.3_出版社价格.sql
          filter: '^2\.3 '
      - id: '2.4'
        setup:
          files:
            - sql/2.4_从未借书.sql
          filter: '^2\.4 '
      - id: '2.5'
        setup:
          files:
            - sql/2.5_未还图书.sql
          filter: '^2\.5 '
